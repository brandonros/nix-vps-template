name: Destroy

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: 'Deployment to destroy'
        default: 'default'
        type: choice
        options:
          - default
          - ez3proxy
          - nixginx
          - k3s

env:
  VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
  TF_VAR_encryption_passphrase: ${{ secrets.TF_ENCRYPTION_PASSPHRASE }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup SSH key
        run: |
          mkdir -p keys
          echo "${{ secrets.DEPLOY_KEY }}" > keys/deploy-key
          chmod 600 keys/deploy-key

      # Destroy infrastructure (also removes workspace and server.json)
      - run: nix develop --command just destroy ${{ inputs.deployment }}

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/ deployments/${{ inputs.deployment }}/
          git diff --staged --quiet || git commit -m "Destroy ${{ inputs.deployment }}: update state"
          git push
