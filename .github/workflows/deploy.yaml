name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, destroy]
        default: deploy

env:
  VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
  TF_VAR_encryption_passphrase: ${{ secrets.TF_ENCRYPTION_PASSPHRASE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup SSH key
        run: |
          mkdir -p secrets
          echo "${{ secrets.DEPLOY_KEY }}" > secrets/deploy-key
          chmod 600 secrets/deploy-key

      - run: nix develop --command just ci-go

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/terraform.tfstate
          git diff --staged --quiet || git commit -m "Update terraform state"
          git push

  destroy:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command just ci-destroy

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/terraform.tfstate
          git diff --staged --quiet || git commit -m "Update terraform state"
          git push
