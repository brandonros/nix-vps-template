name: Deploy

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'GitHub repo (e.g., brandonros/ez3proxy)'
        default: 'brandonros/nix-vps-template'
      flake:
        description: 'Flake name (e.g., ez3proxy)'
        default: 'nixos-vps'
      branch:
        description: 'Branch (optional)'
        default: ''

env:
  VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
  TF_VAR_encryption_passphrase: ${{ secrets.TF_ENCRYPTION_PASSPHRASE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Setup SSH key
        run: |
          mkdir -p keys
          echo "${{ secrets.DEPLOY_KEY }}" > keys/deploy-key
          chmod 600 keys/deploy-key
      # create vm from nixos snapshot
      - run: nix develop --command just ci-deploy
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/terraform.tfstate
          git diff --staged --quiet || git commit -m "Update terraform state"
          git push
      # wait for ssh
      - run: nix develop --command just wait
      # nixos-rebuild against target flake
      - run: nix develop --command just rebuild '${{ inputs.repo }}' '${{ inputs.flake }}' '${{ inputs.branch }}'
