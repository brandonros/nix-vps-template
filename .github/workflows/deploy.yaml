name: Deploy

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: 'Deployment to deploy'
        default: 'default'
        type: choice
        options:
          - default
          - ez3proxy
          - nixginx
          - k3s

env:
  VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
  TF_VAR_encryption_passphrase: ${{ secrets.TF_ENCRYPTION_PASSPHRASE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup SSH key
        run: |
          mkdir -p keys
          echo "${{ secrets.DEPLOY_KEY }}" > keys/deploy-key
          chmod 600 keys/deploy-key

      # Deploy infrastructure
      - run: nix develop --command just deploy ${{ inputs.deployment }}

      # Write server IP to deployment config
      - run: nix develop --command just write-config ${{ inputs.deployment }}

      # Commit state + server config
      - name: Commit state and config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/ deployments/${{ inputs.deployment }}/server.json
          git diff --staged --quiet || git commit -m "Deploy ${{ inputs.deployment }}: update state and server config"
          git push

      # Wait for NixOS
      - run: nix develop --command just wait ${{ inputs.deployment }}

      # Rebuild with deployment config
      - run: nix develop --command just rebuild ${{ inputs.deployment }}
