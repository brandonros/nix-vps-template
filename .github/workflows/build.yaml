name: Build NixOS Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build image
        run: nix build .#vultr-image -L

      - name: Prepare image
        run: |
          ls -la result/
          img=$(find result/ -name "*.img" -o -name "*.raw" | head -1)
          cp "$img" nixos-base.raw

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create base --title "Base NixOS Image" --notes "Auto-generated NixOS base image for Vultr" || true
          gh release upload base nixos-base.raw --clobber
