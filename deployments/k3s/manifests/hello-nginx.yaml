apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-nginx-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>k3s nginx</title></head>
    <body>
      <h1>Hello, World!</h1>
      <p>Served with nginx on k3s</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-nginx
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-nginx
  template:
    metadata:
      labels:
        app: hello-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: hello-nginx-html
---
apiVersion: v1
kind: Service
metadata:
  name: hello-nginx
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: hello-nginx
  ports:
    - port: 80
      targetPort: 80
